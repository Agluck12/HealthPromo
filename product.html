<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — HealthPromo</title>
<meta name="description" content="Custom-branded promotional items for healthcare providers and ABA therapy centers.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="canonical" id="canonicalTag" href="https://healthpromo.net/product.html">
<script>
  (function(){
    var tag = document.getElementById('canonicalTag');
    if (tag) tag.href = 'https://healthpromo.net' + window.location.pathname + window.location.search;
  })();
</script>
<link rel="stylesheet" href="css/style.css">
<style>
  .product-page {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2.5rem 2rem 4rem;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    color: var(--teal);
    font-size: 0.9rem;
    font-weight: 600;
    text-decoration: none;
    margin-bottom: 2rem;
    transition: opacity 0.15s;
  }
  .back-link:hover { opacity: 0.75; }
  .back-link svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

  .product-detail {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3rem;
    align-items: start;
  }

  /* ── IMAGE PANEL ── */
  .product-image-wrap {
    background: white;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: var(--card-shadow);
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .product-image-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 2rem;
  }
  .product-image-placeholder {
    font-size: 6rem;
  }

  /* ── INFO PANEL ── */
  .product-info-panel {
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  .product-category-tag {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: var(--teal-light);
    color: var(--teal);
    border-radius: 100px;
    padding: 0.3rem 0.85rem;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    width: fit-content;
  }

  .product-title {
    font-family: 'Syne', sans-serif;
    font-size: 1.9rem;
    font-weight: 800;
    color: var(--navy);
    line-height: 1.2;
  }

  .product-price-block {
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
  }
  .product-price-big {
    font-size: 2rem;
    font-weight: 700;
    color: var(--teal);
    font-family: 'Syne', sans-serif;
  }
  .product-price-original {
    font-size: 1.1rem;
    color: var(--muted);
    text-decoration: line-through;
  }
  .product-price-label {
    font-size: 0.95rem;
    font-weight: 400;
    color: var(--muted);
  }
  .product-price-quote {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--accent);
  }

  .product-meta-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
  }
  .meta-item {
    background: var(--warm);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.85rem 1rem;
  }
  .meta-label {
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 0.25rem;
  }
  .meta-value {
    font-size: 1rem;
    font-weight: 700;
    color: var(--navy);
  }

  .product-divider {
    height: 1px;
    background: var(--border);
  }

  .product-description {
    font-size: 0.95rem;
    color: var(--muted);
    line-height: 1.65;
  }

  /* ── ACTIONS ── */
  .product-actions {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .btn-add-quote {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    background: var(--teal);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 1rem 1.5rem;
    font-family: 'Poppins', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    text-decoration: none;
  }
  .btn-add-quote:hover { background: var(--teal-mid); transform: translateY(-1px); }
  .btn-add-quote.added { background: #22a06b; }
  .btn-add-quote svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

  .btn-proof {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    background: white;
    color: var(--navy);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 0.9rem 1.5rem;
    font-family: 'Poppins', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.15s;
    text-decoration: none;
  }
  .btn-proof:hover { border-color: var(--teal); color: var(--teal); transform: translateY(-1px); }
  .btn-proof svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .not-found {
    text-align: center;
    padding: 4rem 2rem;
  }
  .not-found h2 { font-family: 'Syne', sans-serif; color: var(--navy); margin-bottom: 0.5rem; }
  .not-found p { color: var(--muted); margin-bottom: 1.5rem; }
  .not-found a { color: var(--teal); font-weight: 600; text-decoration: none; }

  /* ── RELATED PRODUCTS ── */
  .related-section {
    margin-top: 4rem;
  }
  .related-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .related-section h2 {
    font-family: 'Syne', sans-serif;
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--navy);
    margin: 0;
  }
  .related-view-all {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--teal);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    transition: opacity 0.15s;
  }
  .related-view-all:hover { opacity: 0.7; }
  .related-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1rem;
  }
  .related-card {
    background: white;
    border-radius: 14px;
    border: 1px solid var(--border);
    box-shadow: var(--card-shadow);
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: box-shadow 0.2s, transform 0.15s;
    display: block;
    position: relative;
  }
  .related-card:hover { box-shadow: var(--card-shadow-hover); transform: translateY(-2px); }
  .related-card-img {
    aspect-ratio: 1;
    background: var(--warm);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .related-card-img img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 0.75rem;
  }
  .related-card-quick-add {
    position: absolute;
    bottom: 0.5rem;
    right: 0.5rem;
    background: var(--teal);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0.35rem 0.65rem;
    font-family: 'Poppins', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.3rem;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.15s, transform 0.15s, background 0.15s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 2;
  }
  .related-card-quick-add svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; }
  .related-card:hover .related-card-quick-add {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .related-card-quick-add:hover { background: var(--navy); }
  .related-card-quick-add.added { background: #22a06b; }
  .related-card-info {
    padding: 0.75rem;
  }
  .related-card-name {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--navy);
    line-height: 1.3;
    margin-bottom: 0.3rem;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .related-card-price {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--teal);
  }

  @media (max-width: 768px) {
    .product-detail { grid-template-columns: 1fr; gap: 1.5rem; }
    .product-title { font-size: 1.5rem; }
    .product-price-big { font-size: 1.6rem; }
    .related-grid { grid-template-columns: repeat(2, 1fr); }
    .product-page { padding: 1.5rem 1rem 3rem; }
    .related-card-quick-add { opacity: 1; transform: none; pointer-events: auto; }
  }
</style>
</head>
<body>
<div id="siteHeader"></div>

<div class="product-page">
  <a href="index.html" class="back-link">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Back to Shop
  </a>

  <div id="productContent">
    <!-- Populated by JS -->
  </div>
</div>

<div id="contactStrip"></div>
<div id="siteFooter"></div>

<script src="js/data.js?v=11"></script>
<script>
  document.getElementById('siteHeader').innerHTML = renderHeader('');
  document.getElementById('contactStrip').innerHTML = renderContactStrip();
  document.getElementById('siteFooter').innerHTML = renderFooter();
  updateCartBadge();

  // ── FIND PRODUCT ──
  const params = new URLSearchParams(window.location.search);
  const productId = params.get('id');

  // Search all categories for matching product
  function findProduct(id) {
    const catalog = getCatalog();
    for (const cat of catalog) {
      const p = cat.products.find(p => p.id === id);
      if (p) return { product: p, category: cat };
    }
    return null;
  }

  const container = document.getElementById('productContent');

  function renderProduct(result) {
    const { product: p, category: cat } = result;
    document.title = `${p.name} — HealthPromo`;
    const metaDesc = p.description
      ? p.description.slice(0, 155).replace(/\s\S*$/, '') + '…'
      : `Custom-branded ${p.name} for healthcare providers, ABA therapy centers, and care organizations. Logo imprinting available.`;
    document.querySelector('meta[name="description"]').setAttribute('content', metaDesc);
    document.querySelector('meta[property="og:title"]') && document.querySelector('meta[property="og:title"]').setAttribute('content', `${p.name} — HealthPromo`);
    document.querySelector('meta[property="og:description"]') && document.querySelector('meta[property="og:description"]').setAttribute('content', metaDesc);

    const isTradeshow = cat.label === 'Tradeshows';
    const imgHtml = p.img
      ? `<img src="${p.img}" alt="${p.name}" onerror="this.parentElement.innerHTML='<div class=\\'product-image-placeholder\\'>🏥</div>'">`
      : `<div class="product-image-placeholder">🏥</div>`;

    let priceHtml = '';
    if (p.price) {
      priceHtml = `<div class="product-price-block"><span class="product-price-label">As low as:&nbsp;</span>`;
      if (p.originalPrice) priceHtml += `<span class="product-price-original">${p.originalPrice}</span>`;
      priceHtml += `<span class="product-price-big">${p.price}</span></div>`;
    } else {
      priceHtml = `<div class="product-price-block"><span class="product-price-label">Contact for pricing — request a quote below</span></div>`;
    }

    const metaItems = [];
    if (p.colors) metaItems.push({ label: 'Color Options', value: `${p.colors} colors` });
    if (p.min) metaItems.push({ label: 'Minimum Qty', value: p.min.toLocaleString() + ' units' });
    metaItems.push({ label: 'Category', value: `${cat.emoji} ${cat.label}` });
    metaItems.push({ label: 'Branding', value: 'Custom logo available' });

    const metaHtml = metaItems.map(m => `
      <div class="meta-item">
        <div class="meta-label">${m.label}</div>
        <div class="meta-value">${m.value}</div>
      </div>`).join('');

    const actionBtn = isTradeshow
      ? `<a class="btn-proof" href="quote.html?product=${encodeURIComponent(p.name)}">
           <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
           Request Design Proof
         </a>`
      : `<button class="btn-proof" id="tryLogoBtn">
           <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
           Try Your Logo
         </button>`;

    container.innerHTML = `
      <div class="product-detail">
        <div class="product-image-wrap">${imgHtml}</div>
        <div class="product-info-panel">
          <div class="product-category-tag">${cat.emoji} ${cat.label}</div>
          <h1 class="product-title">${p.name}</h1>
          ${priceHtml}
          <div class="product-divider"></div>
          <div class="product-meta-grid">${metaHtml}</div>
          <div class="product-divider"></div>
          <p class="product-description">
            ${p.description || 'Custom-branded with your logo or artwork. Perfect for healthcare clinics, ABA therapy centers, hospitals, and care organizations. We handle all artwork preparation and proofing — just send us your logo.'}
          </p>
          <div class="product-actions">
            <button class="btn-add-quote" id="addToQuoteBtn">
              <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Add to Quote List
            </button>
            ${actionBtn}
            <a class="btn-proof" href="quote.html">
              <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              Request a Quote
            </a>
          </div>
        </div>
      </div>
      ${buildRelated(p.id, cat)}
    `;

    document.getElementById('addToQuoteBtn').addEventListener('click', function() {
      addToCart({ id: p.id, name: p.name, img: p.img, category: cat.label });
      this.innerHTML = `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> Added to Quote List`;
      this.classList.add('added');
      updateCartBadge();
      setTimeout(() => {
        this.innerHTML = `<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add to Quote List`;
        this.classList.remove('added');
      }, 2000);
    });

    const tryBtn = document.getElementById('tryLogoBtn');
    if (tryBtn) {
      tryBtn.addEventListener('click', () => {
        sessionStorage.setItem('previewProductId', p.id);
        window.location.href = `index.html#preview`;
      });
    }
  }

  // Try DEFAULT_CATALOG first (instant), then fall back to sheet fetch
  let result = findProduct(productId);
  if (result) {
    renderProduct(result);
  } else {
    container.innerHTML = `<div style="text-align:center;padding:3rem;color:var(--muted);font-size:0.9rem;">Loading product…</div>`;
    initCatalog().then(() => {
      const sheetResult = findProduct(productId);
      if (sheetResult) {
        renderProduct(sheetResult);
      } else {
        container.innerHTML = `
          <div class="not-found">
            <h2>Product not found</h2>
            <p>We couldn't find that item. It may have been removed or the link is incorrect.</p>
            <a href="index.html">← Browse all products</a>
          </div>`;
      }
    });
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildRelatedCard(p, catId) {
    const imgHtml = p.img
      ? `<img src="${p.img}" alt="${p.name}" onerror="this.parentElement.innerHTML='<div style=\\'font-size:2rem;text-align:center\\'>🏥</div>'">`
      : `<div style="font-size:2rem">🏥</div>`;
    return `
      <a class="related-card" href="product.html?id=${p.id}" data-pid="${p.id}" data-pname="${p.name.replace(/"/g,'&quot;')}" data-pimg="${p.img||''}" data-catid="${catId}">
        <div class="related-card-img">
          ${imgHtml}
          <button class="related-card-quick-add" data-pid="${p.id}" title="Add to Quote List">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            + Quote
          </button>
        </div>
        <div class="related-card-info">
          <div class="related-card-name">${p.name}</div>
          <div class="related-card-price">As low as: ${p.price || '$--'}</div>
        </div>
      </a>`;
  }

  function buildRelated(currentId, currentCat) {
    const catalog = getCatalog();

    // Same-category products (shuffled, excluding current)
    const samePool = shuffle(currentCat.products.filter(p => p.id !== currentId));
    const samePicks = samePool.slice(0, 8);

    // Cross-category picks — 1 random product from each other category
    const crossPicks = [];
    for (const cat of catalog) {
      if (cat.id === currentCat.id) continue;
      const pool = cat.products.filter(p => p.img); // prefer products with images
      if (!pool.length) continue;
      const pick = pool[Math.floor(Math.random() * pool.length)];
      crossPicks.push({ p: pick, cat });
    }
    const crossShuffled = shuffle(crossPicks).slice(0, 4);

    let html = '';

    if (samePicks.length) {
      const catUrl = `index.html?cat=${encodeURIComponent(currentCat.id)}`;
      const cards = samePicks.map(p => buildRelatedCard(p, currentCat.id)).join('');
      html += `
        <div class="related-section">
          <div class="related-header">
            <h2>More from ${currentCat.emoji} ${currentCat.label}</h2>
            <a class="related-view-all" href="${catUrl}">View all ${currentCat.label} →</a>
          </div>
          <div class="related-grid">${cards}</div>
        </div>`;
    }

    if (crossShuffled.length) {
      const cards = crossShuffled.map(({ p, cat }) => buildRelatedCard(p, cat.id)).join('');
      html += `
        <div class="related-section">
          <div class="related-header">
            <h2>You might also like</h2>
            <a class="related-view-all" href="index.html">Browse all →</a>
          </div>
          <div class="related-grid">${cards}</div>
        </div>`;
    }

    return html;
  }

  // Quick-add delegate listener
  document.addEventListener('click', function(e) {
    const btn = e.target.closest('.related-card-quick-add');
    if (!btn) return;
    e.preventDefault();
    e.stopPropagation();
    const card = btn.closest('.related-card');
    const pid = card.dataset.pid;
    const pname = card.dataset.pname;
    const pimg = card.dataset.pimg;
    const catId = card.dataset.catid;
    const catalog = getCatalog();
    const cat = catalog.find(c => c.id === catId);
    addToCart({ id: pid, name: pname, img: pimg, category: cat ? cat.label : '' });
    updateCartBadge();
    btn.innerHTML = `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> Added`;
    btn.classList.add('added');
    setTimeout(() => {
      btn.innerHTML = `<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> + Quote`;
      btn.classList.remove('added');
    }, 1500);
  });
</script>
</body>
</html>
